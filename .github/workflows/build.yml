name: Build UIEdit

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore UIEdit.sln

      - name: Download FreeImage 3.18.0 Win32
        shell: powershell
        run: |
          # Download FreeImage 3.18.0 Win32 binary distribution from SourceForge
          $url = "https://sourceforge.net/projects/freeimage/files/Source%20Distribution/3.18.0/FreeImage3180Win32.zip/download"
          $output = "FreeImage3180Win32.zip"
          Write-Host "Downloading FreeImage Win32 from SourceForge..."
          Invoke-WebRequest -Uri $url -OutFile $output -MaximumRedirection 5 -UserAgent "Mozilla/5.0"
          Write-Host "Extracting..."
          Expand-Archive -Path $output -DestinationPath FreeImageWin32 -Force
          Write-Host "Contents:"
          Get-ChildItem -Recurse FreeImageWin32 -Filter "FreeImage.dll" | ForEach-Object { Write-Host "  $($_.FullName)" }
          # Copy 32-bit FreeImage.dll to Library, replacing the 64-bit one
          $dll32 = Get-ChildItem -Recurse FreeImageWin32 -Filter "FreeImage.dll" | Select-Object -First 1
          Copy-Item $dll32.FullName -Destination Library\FreeImage.dll -Force
          Write-Host "Replaced Library\FreeImage.dll with 32-bit version"

      - name: Build (Release|x86)
        run: msbuild UIEdit.sln /p:Configuration=Release /p:Platform=x86 /t:Build /v:minimal

      - name: Copy native FreeImage.dll to output
        run: copy Library\FreeImage.dll UIEdit\bin\x86\Release\FreeImage.dll

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: UIEdit-x86
          path: UIEdit/bin/x86/Release/
